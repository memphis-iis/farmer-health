name: PR governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Require linked issue in PR body or branch name
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const branch = pr.head.ref || "";
            const linkedInBody = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*#\d+\b/i.test(body)
              || /\b#\d+\b/.test(body);
            const linkedInBranch = /^(\d+)[-_]/.test(branch) || /[-_](\d+)[-_]/.test(branch);
            if (!linkedInBody && !linkedInBranch) {
              core.setFailed(
                "Ready-for-review PRs must link an issue (e.g. Closes #123) or use a branch like 123-short-slug."
              );
            } else {
              core.info("Linked issue check passed.");
            }
