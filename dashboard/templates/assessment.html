<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Assessment | Farmer Health</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #26352c;
            margin: 0;
        }
        header {
            background: #245c45;
            color: white;
            padding: 24px 8%;
        }
        main {
            max-width: 750px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000012;
        }
        h2 { color: #245c45; }
        .question {
            padding: 16px 0;
            border-bottom: 1px solid #e3e9e5;
        }
        label {
            display: block;
            margin: 10px 0;
        }
        button, .back {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #2f7553;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover, .back:hover { background: #20553b; }
        #result {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<header>
    <h1>Farmer Health Dashboard</h1>
    <p>Start Assessment</p>
</header>
<main>
 
    <a class="back" href="/dashboard/">Back to Dashboard</a>
</main>
</body>
