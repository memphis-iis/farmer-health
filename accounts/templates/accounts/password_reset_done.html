{% extends "core/base.html" %}

{% block title %}Reset Instructions{% endblock %}

{% block content %}
<h1>Check Your Email</h1>

<div class="fh-card">
  <p>
    If an account exists with the email address you entered,
    password-reset instructions have been sent.
  </p>
  <p>Please check your email for the reset link.</p>

  <div class="fh-actions">
    <a class="fh-btn fh-btn--block" href="{% url 'accounts:login' %}">Back to Sign In</a>
  </div>
</div>
{% endblock %}
